<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Floret</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:wght@400;500&family=Press+Start+2P&display=swap">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #fde7f1;
            font: 10px/1.7 'Press Start 2P', ui-monospace, monospace;
            color: #5b1f45
        }

        #cv {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none
        }

        #menu {
            position: fixed;
            inset: 0;
            z-index: 20;
            overflow: hidden;
            background: linear-gradient(#5ec8ff, #a8e6ff 38%, #ffd1e8 62%, #ffb3d9);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center
        }

        .sun {
            position: absolute;
            top: 9%;
            right: 12%;
            width: 70px;
            height: 70px;
            background: #ffe14d;
            box-shadow: 0 0 0 6px #fff7b0;
            clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%)
        }

        .cl {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #fff;
            box-shadow: 12px 0 #fff, 24px 0 #fff, 36px 0 #fff, 12px -12px #fff, 24px -12px #fff, -12px 12px #fff, 48px 12px #fff, 0 12px #fff, 12px 12px #fff, 24px 12px #fff, 36px 12px #fff;
            transform: scale(2);
            animation: drift linear infinite
        }

        @keyframes drift {
            to {
                left: 120vw
            }
        }

        .hills {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 34%;
            height: 110px;
            background: #7be07b;
            clip-path: polygon(0 100%, 0 60%, 8% 60%, 8% 40%, 20% 40%, 20% 20%, 34% 20%, 34% 40%, 46% 40%, 46% 60%, 60% 60%, 60% 30%, 76% 30%, 76% 50%, 90% 50%, 90% 70%, 100% 70%, 100% 100%)
        }

        .road {
            position: absolute;
            left: -50%;
            right: -50%;
            bottom: -8%;
            height: 44%;
            background: repeating-conic-gradient(#ff7ab8 0 25%, #fff 0 50%) 0 0/72px 72px;
            transform: perspective(260px) rotateX(58deg);
            transform-origin: 50% 100%;
            animation: roll 1.2s linear infinite
        }

        @keyframes roll {
            to {
                background-position: 0 72px
            }
        }

        .logo {
            font-size: clamp(34px, 12vw, 96px);
            color: #ff5fa2;
            text-shadow: 3px 0 #fff, -3px 0 #fff, 0 3px #fff, 0 -3px #fff, 0 6px #b0306d, 0 9px #b0306d, 0 12px #7a1f4c, 6px 12px #7a1f4c;
            transform: rotate(-3deg);
            animation: bob 1.4s steps(4) infinite
        }

        @keyframes bob {
            50% {
                transform: rotate(-3deg) translateY(-8px)
            }
        }

        .sub {
            font-size: 11px;
            color: #fff;
            text-shadow: 2px 2px #b0306d
        }

        .fl {
            font-size: 28px;
            animation: hop .8s steps(2) infinite
        }

        @keyframes hop {
            50% {
                transform: translateY(-6px)
            }
        }

        .opt {
            display: block;
            width: min(78vw, 320px);
            margin: 12px auto;
            padding: 16px 12px 16px 34px;
            font: inherit;
            font-size: 16px;
            color: #fff;
            background: #ff5fa2;
            border: 4px solid #fff;
            box-shadow: 0 0 0 4px #b0306d, 6px 6px 0 4px #7a1f4c;
            cursor: pointer;
            position: relative;
            text-shadow: 2px 2px #b0306d
        }

        .opt.on {
            background: #ff2e8a;
            transform: translate(-2px, -2px)
        }

        .opt.on::before {
            content: "\25B6";
            position: absolute;
            left: 10px;
            animation: blink .6s steps(2) infinite
        }

        @keyframes blink {
            50% {
                opacity: 0
            }
        }

        .pnl {
            position: fixed;
            background: #fff0f7;
            border: 4px solid #ff5fa2;
            box-shadow: 4px 4px 0 #b0306d;
            padding: 8px 10px;
            z-index: 10
        }

        #top {
            top: calc(env(safe-area-inset-top, 0px) + 8px);
            left: 8px;
            display: flex;
            gap: 14px
        }

        #hint {
            top: calc(env(safe-area-inset-top, 0px) + 8px);
            right: 8px;
            max-width: 48vw;
            font-size: 8px
        }

        #hb {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
            max-width: 94vw;
            overflow-x: auto
        }

        #hb button,
        #btn button,
        #dp button {
            font: inherit;
            font-size: 9px;
            background: #fff0f7;
            color: #5b1f45;
            border: 3px solid #ff5fa2;
            box-shadow: 3px 3px 0 #b0306d;
            padding: 8px;
            cursor: pointer;
            flex: none
        }

        #hb button.on {
            background: #ff5fa2;
            color: #fff
        }

        #btn {
            position: fixed;
            right: 8px;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10
        }

        #btn button {
            font-size: 16px
        }

        #dp {
            position: fixed;
            left: 8px;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
            display: none;
            grid-template-columns: repeat(3, 44px);
            gap: 4px;
            z-index: 10
        }

        #dp button {
            height: 44px;
            padding: 0;
            touch-action: none
        }

        @media (pointer:coarse) {
            #dp {
                display: grid
            }
        }

        #ov {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            align-items: center;
            justify-content: center;
            background: #5b1f4566
        }

        #pop {
            position: static;
            width: min(92vw, 420px);
            max-height: 86vh;
            overflow: auto;
            font-size: 10px
        }

        #pop h3 {
            margin: 0 0 4px;
            font-size: 15px;
            color: #ff2e8a
        }

        #pop .opt {
            width: 100%
        }

        .rw {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            margin: 4px 0;
            font-size: 9px
        }

        .rw button {
            font: inherit;
            font-size: 8px;
            background: #ff5fa2;
            color: #fff;
            border: 2px solid #b0306d;
            padding: 5px;
            cursor: pointer
        }

        #sl {
            max-height: 46vh;
            overflow: auto
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 30%;
            transform: translateX(-50%);
            background: #fff0f7;
            border: 4px solid #ff5fa2;
            padding: 10px 14px;
            z-index: 40;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            text-align: center;
            max-width: 86vw
        }

        #menu {
            --d: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22110%22 height=%22110%22%3E%3Cg fill=%22%23ffffff%22 fill-opacity=%22.8%22%3E%3Ccircle cx=%2230%22 cy=%2216%22 r=%229%22/%3E%3Ccircle cx=%2242%22 cy=%2223%22 r=%229%22/%3E%3Ccircle cx=%2242%22 cy=%2237%22 r=%229%22/%3E%3Ccircle cx=%2230%22 cy=%2244%22 r=%229%22/%3E%3Ccircle cx=%2218%22 cy=%2237%22 r=%229%22/%3E%3Ccircle cx=%2218%22 cy=%2223%22 r=%229%22/%3E%3C/g%3E%3Ccircle cx=%2230%22 cy=%2230%22 r=%225%22 fill=%22%23ffd9a0%22/%3E%3C/svg%3E');
            background: radial-gradient(45% 40% at 50% 46%, #ffffffd9, #fff0 100%), radial-gradient(60% 50% at 15% 12%, #ffdce9, #fff0 70%), radial-gradient(55% 50% at 88% 20%, #e3d9ff, #fff0 70%), radial-gradient(60% 55% at 72% 98%, #d6f2e2, #fff0 70%), linear-gradient(160deg, #fff7fa, #f4efff)
        }

        #menu::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--d) 0 0/110px 110px, var(--d) 55px 70px/170px 170px;
            opacity: .55;
            animation: dr 80s linear infinite
        }

        @keyframes dr {
            to {
                background-position: 110px 110px, 225px 240px
            }
        }

        #menu>div:last-of-type {
            z-index: 2
        }

        .sun,
        .cl,
        .hills,
        .road,
        .fl {
            display: none
        }

        #menu,
        #menu * {
            font-family: 'DM Sans', system-ui, sans-serif
        }

        #menu .logo {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 500;
            font-size: clamp(56px, 13vw, 120px);
            letter-spacing: .16em;
            text-indent: .16em;
            color: #4a2f45;
            text-shadow: none;
            transform: none;
            animation: none;
            line-height: 1
        }

        #menu .logo::after {
            content: '';
            display: block;
            width: 56px;
            height: 1px;
            background: #d9a6bd;
            margin: 20px auto 0
        }

        #menu .sub {
            color: #8a6a82;
            text-shadow: none;
            font-size: 11px;
            letter-spacing: .32em;
            text-transform: uppercase;
            font-weight: 500
        }

        #menu .opt {
            font: 500 13px 'DM Sans', sans-serif;
            letter-spacing: .3em;
            text-indent: .3em;
            text-transform: uppercase;
            color: #4a2f45;
            background: #ffffffb8;
            border: 1px solid #ead0dc;
            border-radius: 999px;
            box-shadow: 0 10px 30px #d9a6bd40;
            text-shadow: none;
            padding: 16px 28px;
            text-align: center;
            transform: none
        }

        #menu .opt.on {
            background: #f1b3cd;
            border-color: #f1b3cd;
            color: #fff
        }

        #menu .opt.on::before {
            content: none
        }

        #btn {
            display: grid;
            grid-template-columns: repeat(2, auto)
        }

        #pt {
            top: calc(env(safe-area-inset-top, 0px) + 64px);
            left: 8px;
            font-size: 8px
        }

        .gr {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 6px;
            margin: 6px 0
        }

        .gb {
            font: inherit;
            font-size: 8px;
            background: #fff;
            color: #5b1f45;
            border: 3px solid #ff5fa2;
            padding: 7px;
            cursor: pointer;
            text-align: left
        }

        .gb.on {
            background: #ff5fa2;
            color: #fff
        }

        #fq {
            width: 100%;
            font: inherit;
            font-size: 9px;
            padding: 7px;
            border: 3px solid #ff5fa2;
            margin-bottom: 6px
        }
    </style>
</head>

<body>
    <canvas id="cv"></canvas>
    <div id="hud" style="display:none">
        <div class="pnl" id="top"><span id="co"></span><span id="ck"></span><span id="dx"></span></div>
        <div class="pnl" id="hint"></div>
        <div id="hb"></div>
        <div id="btn"><button data-a="E">&#127793;</button><button data-a="R">&#128167;</button><button
                data-a="B">&#128722;</button><button data-a="M">&#9776;</button></div>
        <div id="dp"><i></i><button data-k="f">&#9650;</button><i></i><button data-k="l">&#9664;</button><button
                data-k="b">&#9660;</button><button data-k="r">&#9654;</button></div>
    </div>
    <div id="ov">
        <div class="pnl" id="pop"></div>
    </div>
    <div id="toast"></div>
    <div id="menu">
        <div class="sun"></div>
        <div class="cl" style="top:14%;left:-150px;animation-duration:26s"></div>
        <div class="cl" style="top:27%;left:-320px;animation-duration:40s"></div>
        <div class="hills"></div>
        <div class="road"></div>
        <div style="position:relative;display:grid;gap:14px;justify-items:center">
            <div class="sub">a garden to grow &amp; learn in</div>
            <div class="logo">FLORET</div>
            <div class="fl">&#127799; &#127804; &#127800; &#127803; &#127801;</div>
            <div id="mo"><button class="opt on" data-m="p">PLAY</button><button class="opt" data-m="x">EXIT</button>
            </div>
            <div class="sub" style="font-size:8px">&#8593;&#8595; + ENTER</div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
